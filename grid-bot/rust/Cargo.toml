[package]
name = "decibel-grid-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Decibel grid monitor and dry-run bot with CLI and mouse/keyboard TUI"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "5"
dotenvy = "0.15"
futures-util = "0.3"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
rust_decimal_macros = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
pretty_assertions = "1.4"
