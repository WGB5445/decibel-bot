[package]
name = "decibel-grid-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Decibel grid monitor and dry-run bot with CLI and mouse/keyboard TUI"

[dependencies]
anyhow = "1.0"
aptos-sdk = { version = "0.6", default-features = false, features = ["ed25519"] }
arboard = "3.4"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "5"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
rand = "0.8"
ratatui = "0.29"
sha3 = "0.10"
# Match the reqwest major version aptos-sdk already pulls in. Keeping a second reqwest 0.12 here
# would also drag in a second rustls provider (ring), which is what made rustls refuse to choose.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "http2",
    "charset",
    "system-proxy",
    "rustls",
] }
# rustls picks a provider automatically only when exactly one is enabled. Depend on it directly so
# the choice is pinned in code and a future dependency cannot silently reintroduce the ambiguity.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
rust_decimal_macros = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
fslock = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
pretty_assertions = "1.4"
